name: e-EnergyMind
slug: e_energymind
description: "Gestione energetica fotovoltaica con UI Admin/User (Vue)"
version: 1.8.2
arch: [amd64, aarch64, armv7]
init: false
startup: services
boot: auto
host_network: true
homeassistant_api: true
hassio_api: true
panel_icon: mdi:solar-power
panel_title: e-EnergyMind
ingress: true
ingress_port: 8100
map:
  - share:rw
ports:
  8100/tcp: 8100
ports_description:
  8100/tcp: "Web UI (ingress/proxy)"
options:
  log_level: info
  pdc_enabled: false
  ha_url: "http://homeassistant:8123"
  ha_token: ""
schema:
  log_level: list(trace|debug|info|warning|error)
  pdc_enabled: bool
  ha_url: str
  ha_token: str
